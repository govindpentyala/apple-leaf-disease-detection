<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}APPLEYSIS{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/my-style.css') }}" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <header id="navbar">
        <nav>
            <div class="logo-container">
                <img src="{{ url_for('static', filename='images/homelogo.jpg') }}" alt="APPLEYSIS Logo" id="logo">
                <span class="logo-text">APPLEYSIS</span>
            </div>
            <ul>
                <li><a href="{{ url_for('home') }}" {% if request.path in ['/', '/home'] %}class="active"{% endif %}>Home</a></li>
                <li><a href="{{ url_for('apple') }}" {% if request.path == '/apple' %}class="active"{% endif %}>Apple</a></li>
                <li><a href="{{ url_for('leaf') }}" {% if request.path == '/leaf' %}class="active"{% endif %}>Leaf</a></li>
                <li><a href="{{ url_for('video') }}" {% if request.path == '/videos' %}class="active"{% endif %}>Videos</a></li>
                <li><a href="{{ url_for('contact') }}" {% if request.path == '/contact-us' %}class="active"{% endif %}>Contact Us</a></li>
                <li><a href="{{ url_for('join') }}" {% if request.path == '/join-us' %}class="active"{% endif %}>Join Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; 2025 APPLEYSIS. All rights reserved.</p>
            <div class="social-links">
                <a href="#"><i class="fab fa-facebook"></i></a>
                <a href="#"><i class="fab fa-twitter"></i></a>
                <a href="#"><i class="fab fa-instagram"></i></a>
                <a href="#"><i class="fab fa-linkedin"></i></a>
            </div>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
